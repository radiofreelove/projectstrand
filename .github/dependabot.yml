# Monthly update proposals for build tools. Each one arrives as a pull request
# that must pass the checks and the review checklist before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Covers requirements.txt and test-tools/requirements.txt: Dependabot's pip
  # updates read requirement files in subfolders too, so a second pip entry
  # for /test-tools only opened duplicate pull requests (2026-11-03).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  # Test-only tools, kept in test-tools/ so Cloudflare Pages does not install
  # them on every deploy.
  # A Playwright update must change test-tools/package.json,
  # test-tools/requirements.txt, and the axe job's container tag together;
  # tests/check_versions.py fails until all three match.
  - package-ecosystem: npm
    directory: /test-tools
    schedule:
      interval: monthly
