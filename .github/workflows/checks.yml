# The Strand Project: checks on every push and pull request.
#
# Publishing happens in Cloudflare Pages, which builds the site itself with
# scripts/cloudflare_build.sh (and runs the fast checks before deploying).
# This workflow adds the checks Cloudflare cannot run: a real browser and axe-core.
# The Monday link check, freshness report, and evidence audit live in
# .github/workflows/weekly.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r requirements.txt
      - name: Fetch the optional font (exit 2 = no network, keep going)
        run: python3 scripts/fetch_fonts.py || [ $? -eq 2 ]
      - run: python3 build.py
      - run: python3 build.py --check-docs
      - run: python3 tests/check_site.py
      - run: python3 tests/contrast.py
      - run: python3 tests/readability.py
      - run: python3 tests/path_rules.py
      - run: python3 tests/check_versions.py
      - name: Tool tests (evidence audit, date updater, and provenance)
        run: |
          python3 tests/test_evidence_audit.py
          python3 tests/test_mechanical_update.py
          python3 tests/test_provenance.py
      - name: Clean-URL build, as Cloudflare serves it
        run: |
          CLEAN_URLS=1 python3 build.py
          python3 tests/check_site.py
          python3 build.py
      - name: Source freshness (warning only)
        run: python3 tests/freshness.py
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7

  browser:
    name: Browser checks (Chromium)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r test-tools/requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public
      - run: python3 tests/browser_checks.py

  axe:
    name: axe-core (warning only)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: public
          path: public
      - run: npm install --prefix test-tools --no-audit --no-fund --no-package-lock
      - run: ln -s test-tools/node_modules node_modules   # so tests/axe_check.mjs can import them
      - run: node tests/axe_check.mjs

  merge-gate:
    name: Merge gate (the health vector may not fall)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: head

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyYAML (the guards read the YAML registry and baseline)
        run: python3 -m pip install pyyaml

      - name: Compare the offline health vector with the base branch
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 head/tests/merge_gate.py --base base --head head
