name: Release

# After the checks pass on a push to main, tag that commit and publish a
# GitHub release, if the version in data/site.yml has no tag yet. The
# notes are that version's entry in CHANGELOG.md, word for word
# (tools/release_notes.py). Most pushes change no version and do nothing.
# Mirrors the release workflow in The Stasis Project.

on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish a new version
    # Only for checks that passed on a push to main in this repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish the release if this version has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="$(python3 tools/release_notes.py --field tag)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists. Nothing to do."
            exit 0
          fi
          python3 tools/release_notes.py --field body > "$RUNNER_TEMP/notes.md"
          flags=()
          if [ "$(python3 tools/release_notes.py --field prerelease)" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" --target "$SHA" \
            --title "$(python3 tools/release_notes.py --field title)" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "Published $tag at $SHA."
