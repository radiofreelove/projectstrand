# Numbers and details that change. Pages pull these with fact("id"),
# so one edit here updates every page. Each fact names its source ids.

# ---------------------------------------------------------------- Oregon
or_fee_petition:
  value: "$124"
  sources: [or-ojd-fees]
  note: "Change of name or change of sex, ORS 21.145. One fee for a combined petition (our reading of the fee schedule)."
