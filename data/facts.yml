  value: "$5 per certified copy, plus 25 cents a page for paper copies"
  sources: [or-ojd-fees]
or_fee_waiver_application:
  value: "no fee to apply"
  sources: [or-ojd-fees]
or_confidential_date:
  value: "July 1, 2026"
