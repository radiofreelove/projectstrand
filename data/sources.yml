# Every source the site or its research log relies on.
#
# status:
#   verified    We opened and read it on the "checked" date.
#   secondary   We opened it, but it is not an official government source.
#               The site labels it "Not official".
#   unverified  We could not open it. Anything we say from it is labeled
#               "Not confirmed" on the site.
#   linked      A navigation link (a form, a directory). We do not rely on it
#               for any fact.
# official: false for non-government organizations.
# docs_only: true when only the research log uses it.

